<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="unity-loading-bar">
  <div id="unity-logo"><img src="TemplateData/yogu_logo_{{{ SPLASH_SCREEN_STYLE.toLowerCase() }}}.png" alt="Game logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>
  <!-- Orientation overlay shown when device is in landscape -->
  <div id="rotate-overlay">Please rotate your device to portrait to play.</div>
    <script src="app.js"></script>
    <script src="https://unpkg.com/@telegram-apps/sdk@latest/dist/index.js"></script>
    <script src="mobile-fullscreen.js"></script>
  </body>
</html>
